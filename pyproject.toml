[project]
name = "epub-to-m4b"
version = "0.2.0"
description = "Turn an EPUB into an M4B audiobook with a WebVTT transcript, using pluggable TTS engines."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["epub", "audiobook", "m4b", "tts", "text-to-speech", "webvtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ebooklib>=0.19",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "num2words>=0.5.14",
    "numpy>=2",
    "soundfile>=0.13",
    "httpx>=0.28",
    "mutagen>=1.47",
]

[project.urls]
Homepage = "https://github.com/aaron-ang/epub-to-m4b"
Repository = "https://github.com/aaron-ang/epub-to-m4b"
Issues = "https://github.com/aaron-ang/epub-to-m4b/issues"
Changelog = "https://github.com/aaron-ang/epub-to-m4b/blob/main/CHANGELOG.md"

[project.scripts]
epub-to-m4b = "epub_to_m4b.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.14",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_to_m4b"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["epub_to_m4b"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ebooklib.*", "soundfile", "num2words"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mutagen ships py.typed but leaves MP4/MP4Cover/save untyped; keep its
# types and allow the untyped calls only where they happen.
module = ["epub_to_m4b.audio.metadata"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sidecar: needs a running local TTS sidecar server",
    "network: hits a paid API",
]
addopts = "-m 'not sidecar and not network'"

[tool.coverage.run]
source = ["epub_to_m4b"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
