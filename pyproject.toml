[project]
name = "epub-to-m4b"
version = "0.3.0"
description = "Turn an EPUB into an M4B audiobook with a WebVTT transcript, using pluggable TTS engines."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["epub", "audiobook", "m4b", "tts", "text-to-speech", "webvtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ebooklib>=0.19",
    "beautifulsoup4>=4.13",
    "lxml>=5",
    "nemo-text-processing>=1.2",
    "numpy>=2",
    "soundfile>=0.13",
    "httpx>=0.28",
    "mutagen>=1.47",
]

[project.urls]
Homepage = "https://github.com/aaron-ang/epub-to-m4b"
Repository = "https://github.com/aaron-ang/epub-to-m4b"
Issues = "https://github.com/aaron-ang/epub-to-m4b/issues"
Changelog = "https://github.com/aaron-ang/epub-to-m4b/blob/main/CHANGELOG.md"

[project.scripts]
epub-to-m4b = "epub_to_m4b.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epub_to_m4b"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

# Compiled dependencies of nemo-text-processing that PyPI has no Python 3.14
# wheels for come from conda-forge, which builds them for every platform
# above: pynini (at the version NeMo pins) with its OpenFst, and editdistance.
[tool.pixi.dependencies]
python = "3.14.*"
pynini = "==2.1.6.post1"
openfst = "1.8.4.*"
editdistance = ">=0.8"

[tool.pixi.pypi-dependencies]
epub-to-m4b = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=6"
ruff = ">=0.12"
mypy = ">=1.14"
types-beautifulsoup4 = "*"

[tool.pixi.feature.dev.tasks]
lint = "ruff check && ruff format --check"
format = "ruff format && ruff check --fix"
typecheck = "mypy"
test = "pytest"
coverage = "pytest --cov --cov-report=term-missing"
check = { depends-on = ["lint", "typecheck", "test"] }

[tool.pixi.environments]
default = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.14"
packages = ["epub_to_m4b"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["ebooklib.*", "soundfile", "nemo_text_processing.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mutagen ships py.typed but leaves MP4/MP4Cover/save untyped; keep its
# types and allow the untyped calls only where they happen.
module = ["epub_to_m4b.audio.metadata"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sidecar: needs a running local TTS sidecar server",
    "network: hits a paid API",
]
addopts = "-m 'not sidecar and not network'"

[tool.coverage.run]
source = ["epub_to_m4b"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
